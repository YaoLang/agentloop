name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test (hermetic, no network)
        run: go test ./...
      - name: Demo
        run: go run ./cmd/agentloop demo
      - name: Eval suite
        run: go run ./cmd/agentloop eval --suite evals/suites/basic.jsonl
      - name: Vet
        run: go vet ./...
